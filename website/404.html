<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found · SLIM</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self';
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data:; connect-src 'none';
                 object-src 'none'; base-uri 'self';" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    .not-found {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 70vh;
      text-align: center; padding: 40px 24px;
    }
    .not-found .code {
      font-family: var(--font-mono); font-size: 5rem; font-weight: 700;
      color: var(--teal-light); line-height: 1; margin-bottom: 16px;
    }
    .not-found h1 { font-size: 1.6rem; margin-bottom: 12px; }
    .not-found p  { color: var(--text-3); margin-bottom: 32px; font-size: 0.95rem; }
    .not-found-links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
<nav id="main-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">SLIM <span>v2.0</span></a>
    <button class="nav-hamburger" id="nav-hamburger" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="playground.html" class="nav-link">Playground</a>
      <a href="docs.html" class="nav-link">Docs</a>
    </div>
  </div>
</nav>

<div class="not-found">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has been moved.</p>
  <div class="not-found-links">
    <a href="index.html" class="btn-primary">← Home</a>
    <a href="playground.html" class="btn-secondary">Try the Playground</a>
    <a href="docs.html" class="btn-secondary">Read the Docs</a>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-copy">© 2026 Sasidhar Nagandla · Made with passion · MIT License</div>
  </div>
</footer>
<script src="js/nav.js"></script>
</body>
</html>
